<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职探AI | 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06121f;
            --bg-mid: #0b2033;
            --line: rgba(117, 231, 255, 0.32);
            --text-main: #e7f7ff;
            --text-dim: #96b8c8;
            --cyan: #43d2ff;
            --teal: #33ffca;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 15%, #0f2d48 0%, var(--bg-deep) 40%),
                        radial-gradient(circle at 90% 75%, #12415d 0%, #030c15 45%);
            color: var(--text-main);
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            display: grid;
            place-items: center;
            padding: 16px;
        }
        .login-shell {
            width: min(520px, 100%);
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(8, 30, 50, 0.9), rgba(5, 21, 36, 0.9));
            padding: 22px;
            overflow: hidden;
        }
        .views {
            position: relative;
            min-height: 360px;
        }
        .view {
            transition: 0.28s ease;
        }
        .view[hidden] {
            display: none !important;
        }
        .brand {
            font-family: "Orbitron", sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #9de8ff;
        }
        .brand.register {
            color: #99ffd8;
            text-shadow: 0 0 14px rgba(51, 255, 202, 0.28);
        }
        .sub {
            color: var(--text-dim);
            margin-bottom: 16px;
        }
        .register-shell {
            border: 1px solid rgba(51, 255, 202, 0.28);
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(8, 44, 46, 0.58), rgba(4, 24, 30, 0.58));
            padding: 12px;
        }
        .field {
            margin-bottom: 10px;
        }
        .field input {
            width: 100%;
            background: rgba(8, 31, 51, 0.8);
            color: var(--text-main);
            border: 1px solid rgba(67, 210, 255, 0.26);
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
        }
        .field input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(67, 210, 255, 0.18);
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            color: #032132;
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--cyan), var(--teal));
        }
        .btn.ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border: 1px solid var(--line);
        }
        .msg {
            margin-top: 10px;
            min-height: 18px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .msg.error {
            color: #ff7979;
        }
        h2 {
            font-family: "Orbitron", sans-serif;
            color: #99ffd8;
            margin: 0 0 6px 0;
        }
    </style>
</head>
<body>
<div class="login-shell">
    <div class="views">
        <div class="view" id="loginView">
            <div class="brand">ZT-AI Console</div>
            <div class="sub">登录后开启求职作战与生涯规划。</div>
            <div class="field">
                <input id="login-username" placeholder="用户名" autocomplete="username" />
            </div>
            <div class="field">
                <input id="login-password" type="password" placeholder="密码" autocomplete="current-password" />
            </div>
            <div class="actions">
                <button class="btn primary" id="login-btn">登录</button>
                <button class="btn ghost" id="switch-register-btn">去注册</button>
            </div>
            <div class="msg" id="login-msg">未注册可先创建账号。</div>
        </div>
        <div class="view" id="registerView" hidden>
            <div class="brand register">注册新账号</div>
            <div class="sub">填写下方信息，完成后即可登录使用。</div>
            <div class="register-shell">
                <h2>NEW USER</h2>
                <div class="field">
                    <input id="register-username" placeholder="用户名（3 - 32 位字母/数字/下划线）" autocomplete="username" />
                </div>
                <div class="field">
                    <input id="register-password" type="password" placeholder="密码（不少于 6 位）" autocomplete="new-password" />
                </div>
                <div class="field">
                    <input id="register-display" placeholder="显示昵称（可选）" autocomplete="nickname" />
                </div>
                <div class="actions">
                    <button class="btn primary" id="register-btn">注册并登录</button>
                    <button class="btn ghost" id="switch-login-btn">返回登录</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
const loginViewEl = document.getElementById("loginView");
const registerViewEl = document.getElementById("registerView");
const usernameEl = document.getElementById("login-username");
const passwordEl = document.getElementById("login-password");
const registerUsernameEl = document.getElementById("register-username");
const registerPasswordEl = document.getElementById("register-password");
const registerDisplayEl = document.getElementById("register-display");
const msgEl = document.getElementById("login-msg");

let currentMode = "login";

function setMsg(text, isError) {
    msgEl.textContent = text || "";
    msgEl.classList.toggle("error", Boolean(isError));
}

async function postJson(url, payload) {
    const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    });
    let data = {};
    try {
        data = await resp.json();
    } catch (err) {
        data = {};
    }
    if (!resp.ok || !data.ok) {
        const message = (data && data.message) || `请求失败 (${resp.status})`;
        throw new Error(message);
    }
    return data;
}

async function register() {
    const username = registerUsernameEl.value.trim();
    const password = registerPasswordEl.value;
    const displayName = registerDisplayEl.value.trim();
    if (!username || !password) {
        setMsg("请填写用户名和密码。", true);
        return;
    }
    try {
        await postJson("/api/auth/register", {
            username,
            password,
            display_name: displayName,
        });
        setMsg("注册成功，正在自动登录...", false);
        await postJson("/api/auth/login", { username, password });
        registerUsernameEl.value = "";
        registerPasswordEl.value = "";
        registerDisplayEl.value = "";
        window.location.href = "/";
    } catch (err) {
        setMsg(`注册失败: ${err.message}`, true);
    }
}

async function login() {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
        setMsg("请填写用户名和密码。", true);
        return;
    }
    try {
        await postJson("/api/auth/login", { username, password });
        usernameEl.value = "";
        passwordEl.value = "";
        window.location.href = "/";
    } catch (err) {
        setMsg(`登录失败: ${err.message}`, true);
    }
}

function switchToRegister() {
    currentMode = "register";
    loginViewEl.hidden = true;
    registerViewEl.hidden = false;
    setMsg("请填写注册信息。", false);
    registerUsernameEl.focus();
}

function switchToLogin() {
    currentMode = "login";
    registerViewEl.hidden = true;
    loginViewEl.hidden = false;
    setMsg("未注册可先创建账号。", false);
    usernameEl.focus();
}

document.getElementById("register-btn")?.addEventListener("click", register);
document.getElementById("login-btn")?.addEventListener("click", login);
document.getElementById("switch-register-btn")?.addEventListener("click", switchToRegister);
document.getElementById("switch-login-btn")?.addEventListener("click", switchToLogin);
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if (currentMode === "register") {
            register();
            return;
        }
        login();
    }
});
</script>
</body>
</html>
